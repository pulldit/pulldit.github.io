name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 2"

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production-relevant dependencies
        # Pulldit ships zero npm packages (static site; deploy copies only index.html/src/assets/vendor).
        # devDependencies (http-server, vitest) never reach users -> keep them out of the scheduled gate.
        # Dev-tool updates are handled by Dependabot; new risky deps on PRs by dependency-review below.
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
